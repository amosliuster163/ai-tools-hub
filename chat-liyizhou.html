<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>与李一舟对话 | AI数字分身</title>
  <meta name="description" content="与李一舟AI数字分身对话，学习一人公司、AI工具、流量打法、提示词工程等实战经验。">
  <link rel="icon" href="favicon.ico">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #e0e0e0;
    }

    /* 导航栏 */
    nav {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    nav .logo a {
      color: #00d4ff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    nav .logo a:hover {
      color: #00f0ff;
    }

    /* 头部 */
    .header {
      text-align: center;
      padding: 40px 20px 20px;
      background: linear-gradient(180deg, #1a1a2e 0%, #0a0a0a 100%);
    }

    .header h1 {
      font-size: 36px;
      background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .header .subtitle {
      color: #999;
      font-size: 15px;
      line-height: 1.6;
      max-width: 600px;
      margin: 0 auto;
    }

    .header .quote {
      margin-top: 20px;
      padding: 16px 24px;
      background: linear-gradient(135deg, rgba(0,212,255,0.1) 0%, rgba(123,47,247,0.1) 100%);
      border-radius: 12px;
      border-left: 4px solid #00d4ff;
      font-style: italic;
      color: #00d4ff;
      font-size: 15px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    /* 对话区域 */
    .chat-container {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .message {
      display: flex;
      gap: 12px;
      padding: 16px;
      border-radius: 16px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      background: #1a1a2e;
      align-self: flex-end;
      max-width: 70%;
    }

    .message.assistant {
      background: linear-gradient(135deg, rgba(123,47,247,0.15) 0%, rgba(0,212,255,0.15) 100%);
      align-self: flex-start;
      max-width: 80%;
      border-left: 3px solid #7b2ff7;
    }

    .message .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .message.user .avatar {
      background: #333;
      color: #fff;
      order: 2;
    }

    .message.assistant .avatar {
      background: linear-gradient(135deg, #7b2ff7 0%, #00d4ff 100%);
      color: white;
    }

    .message .content {
      flex: 1;
      line-height: 1.7;
      font-size: 15px;
    }

    .message.user .content {
      color: #e0e0e0;
      text-align: right;
    }

    .message.assistant .content {
      color: #d0d0d0;
    }

    /* 欢迎消息 */
    .welcome {
      background: linear-gradient(135deg, rgba(0,212,255,0.1) 0%, rgba(123,47,247,0.1) 100%);
      padding: 24px;
      border-radius: 16px;
      border-left: 4px solid #00d4ff;
      margin-bottom: 20px;
    }

    .welcome h3 {
      color: #00d4ff;
      margin-bottom: 12px;
      font-size: 18px;
    }

    .welcome p {
      color: #999;
      line-height: 1.8;
      font-size: 14px;
    }

    .welcome .topics {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .welcome .topics button {
      background: rgba(255,255,255,0.1);
      border: 1px solid #333;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      color: #ccc;
      cursor: pointer;
      transition: all 0.2s;
    }

    .welcome .topics button:hover {
      background: linear-gradient(135deg, #7b2ff7 0%, #00d4ff 100%);
      border-color: transparent;
      color: white;
    }

    /* 输入区域 */
    .input-container {
      background: #111;
      padding: 20px;
      border-top: 1px solid #333;
      position: sticky;
      bottom: 0;
    }

    .input-wrapper {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
    }

    .input-wrapper textarea {
      flex: 1;
      padding: 12px 16px;
      background: #1a1a2e;
      border: 2px solid #333;
      border-radius: 12px;
      font-size: 15px;
      color: #e0e0e0;
      resize: none;
      height: 48px;
      line-height: 1.5;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .input-wrapper textarea:focus {
      outline: none;
      border-color: #7b2ff7;
    }

    .input-wrapper textarea::placeholder {
      color: #666;
    }

    .input-wrapper button {
      background: linear-gradient(135deg, #7b2ff7 0%, #00d4ff 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .input-wrapper button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(123,47,247,0.4);
    }

    .input-wrapper button:disabled {
      background: #333;
      cursor: not-allowed;
    }

    /* 加载状态 */
    .loading {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }

    .loading span {
      width: 8px;
      height: 8px;
      background: #7b2ff7;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .loading span:nth-child(1) { animation-delay: 0s; }
    .loading span:nth-child(2) { animation-delay: 0.2s; }
    .loading span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* 底部信息 */
    .footer {
      text-align: center;
      padding: 16px;
      background: #0a0a0a;
      color: #666;
      font-size: 13px;
      border-top: 1px solid #222;
    }

    .footer a {
      color: #00d4ff;
      text-decoration: none;
    }

    /* 响应式 */
    @media (max-width: 600px) {
      .header h1 {
        font-size: 28px;
      }

      .message {
        max-width: 90%;
      }

      .input-wrapper {
        flex-direction: column;
      }

      .input-wrapper button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">
      <a href="index.html">← 返回首页</a>
    </div>
    <a href="growth-camp/index.html" style="color:#999;text-decoration:none;font-size:14px;">训练营</a>
  </nav>

  <div class="header">
    <h1>与李一舟对话</h1>
    <p class="subtitle">AI一人公司实战派 · 提示词专家 · 流量操盘手<br>学习他的思维框架：双引擎模型、蜂群思维、马上干</p>
    <div class="quote">
      "AI时代最大的红利，就是马上干。先赚钱再谈钱。"
    </div>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="welcome">
      <h3>一舟已至，请畅所欲言 🚀</h3>
      <p>你可以向一舟请教一人公司搭建、AI工具使用、流量打法、提示词工程、创业思考等实战问题。一舟将以直接、果断、金句化的风格为你解答。</p>
      <div class="topics">
        <button onclick="sendQuickMessage('我想做一人公司，但不知道从哪开始')">一人公司起步</button>
        <button onclick="sendQuickMessage('怎么写出好的AI提示词？')">提示词技巧</button>
        <button onclick="sendQuickMessage('AI时代怎么搞流量？')">流量打法</button>
        <button onclick="sendQuickMessage('我现在很焦虑，感觉跟不上AI发展')">AI焦虑</button>
      </div>
    </div>
  </div>

  <div class="input-container">
    <div class="input-wrapper">
      <textarea 
        id="userInput" 
        placeholder="向一舟请教..."
        onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"
      ></textarea>
      <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>

  <div class="footer">
    Powered by <a href="https://open.bigmodel.cn/" target="_blank">智谱AI</a> | 
    AI数字分身 v2.0 | 
    <a href="https://amosliuster163.github.io/ai-tools-hub/" target="_blank">AI Tools Hub</a>
  </div>

  <script>
    let chatHistory = [];
    let isLoading = false;

    // API地址
    const API_URL = '/api/chat-yizhou';

    function addMessage(role, content) {
      const container = document.getElementById('chatContainer');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;
      
      const avatarDiv = document.createElement('div');
      avatarDiv.className = 'avatar';
      avatarDiv.textContent = role === 'user' ? '我' : '舟';
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'content';
      // 支持简单的markdown格式
      contentDiv.innerHTML = content
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
      
      messageDiv.appendChild(avatarDiv);
      messageDiv.appendChild(contentDiv);
      container.appendChild(messageDiv);
      
      container.scrollTop = container.scrollHeight;
    }

    function addLoadingMessage() {
      const container = document.getElementById('chatContainer');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message assistant';
      messageDiv.id = 'loadingMessage';
      
      const avatarDiv = document.createElement('div');
      avatarDiv.className = 'avatar';
      avatarDiv.textContent = '舟';
      
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'loading';
      loadingDiv.innerHTML = '<span></span><span></span><span></span>';
      
      messageDiv.appendChild(avatarDiv);
      messageDiv.appendChild(loadingDiv);
      container.appendChild(messageDiv);
      
      container.scrollTop = container.scrollHeight;
    }

    function removeLoadingMessage() {
      const loadingMessage = document.getElementById('loadingMessage');
      if (loadingMessage) {
        loadingMessage.remove();
      }
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const message = input.value.trim();

      if (!message || isLoading) return;

      // 显示用户消息
      addMessage('user', message);
      input.value = '';
      
      // 禁用按钮，显示加载
      isLoading = true;
      sendBtn.disabled = true;
      sendBtn.textContent = '思考中...';
      addLoadingMessage();

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            message,
            history: chatHistory,
          }),
        });

        const data = await response.json();

        removeLoadingMessage();

        if (data.error) {
          addMessage('assistant', '抱歉，一舟现在思绪纷乱，请稍后再问。');
        } else {
          addMessage('assistant', data.reply);
          chatHistory = data.history;
        }
      } catch (error) {
        removeLoadingMessage();
        addMessage('assistant', '网络不畅，请稍后再试。');
      }

      // 恢复按钮
      isLoading = false;
      sendBtn.disabled = false;
      sendBtn.textContent = '发送';
    }

    function sendQuickMessage(msg) {
      document.getElementById('userInput').value = msg;
      sendMessage();
    }
  </script>
</body>
</html>
