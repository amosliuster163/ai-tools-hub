const card = $('card'), counter = $('counter'), bar = $('bar'), catName = $('catName');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sec = (label, text, cls) => text ? `<section class="${cls||''}"><h2>${label}</h2><p>${esc(text)}</p></section>` : '';

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

/* ---------- 筛选条 ---------- */
function buildFilters(){
  const counts = {};
  ALL.forEach(t => counts[t.category] = (counts[t.category] || 0) + 1);
  const items = [['all', '全部 ' + ALL.length]].concat(
    Object.keys(CATS).filter(c => counts[c]).map(c => [c, CATS[c] + ' ' + counts[c]]));
  $('filters').innerHTML = items.map(([k, label]) =>
    `<span class="chip ${k === filter ? 'on' : ''}" data-cat="${k}">${label}</span>`).join('');
  $('filters').querySelectorAll('.chip').forEach(el => el.onclick = () => applyFilter(el.dataset.cat));
}

function applyFilter(cat){
  filter = cat;
  pool = cat === 'all' ? ALL.slice() : ALL.filter(t => t.category === cat);
  idx = 0; buildFilters(); buildGrid(); render();
  toast(cat === 'all' ? '已显示全部名词' : CATS[cat] + ' · ' + pool.length + ' 条');
}

/* ---------- 索引面板 ---------- */
function buildGrid(){
  $('grid').innerHTML = pool.map((t, i) =>
    `<div class="gitem" data-i="${i}"><span class="dot"></span>${esc(t.termZh)}
       <em>${esc(CATS[t.category] || t.category)}</em></div>`).join('');
  $('grid').querySelectorAll('.gitem').forEach(el => el.onclick = () => {
    idx = +el.dataset.i; $('panel').classList.remove('open'); render();
  });
}

/* ---------- 渲染 ---------- */
function renderCover(){
  const cats  = Object.keys(CATS).filter(c => ALL.some(t => t.category === c)).length;
  const risky = ALL.filter(t => t.riskFlag && t.riskFlag !== 'none').length;
  card.className = 'card';
  card.innerHTML = `<div class="cover">
    <div class="kicker">__KICKER__</div>
    <h1>__TITLE__</h1>
    <p class="sub">每滑动一次，出现一条行业名词释义。<br>
       左栏给定义，右栏给用法 —— 一屏看全，不用上下找。</p>
    <div class="stats">
      <div><b>${ALL.length}</b><span>名词</span></div>
      <div><b>${cats}</b><span>分类</span></div>
      <div><b>${risky}</b><span>合规提示</span></div>
    </div>
    <div class="go" id="goFirst">开始滑动</div>
  </div>`;
  counter.textContent = ''; catName.textContent = '封面'; bar.style.width = '0%';
  $('goFirst').onclick = e => { e.stopPropagation(); idx = 0; render(); };
}

function renderEnd(){
  card.className = 'card';
  card.innerHTML = `<div class="cover">
    <div class="kicker">END OF DECK</div>
    <h1>已滑完 ${pool.length} 条</h1>
    <p class="sub">回看某一条可打开顶部「目录」，或用左方向键往回滑。<br>
       想换个主题，点上方分类标签重新筛一遍。</p>
    <div class="go" id="goRestart">从头再来</div>
  </div>`;
  counter.textContent = pool.length + ' / ' + pool.length;
  catName.textContent = '已完成'; bar.style.width = '100%';
  $('goRestart').onclick = e => { e.stopPropagation(); idx = 0; render(); };
}

function render(){
  if (idx < 0)            return renderCover();
  if (idx >= pool.length) return renderEnd();

  const t = pool[idx];
  const riskName = RISKS[t.riskFlag] || t.riskFlag;
  const riskBody = RISK_TEXT[t.riskFlag] || RISK_TEXT._default;
  const risk = (t.riskFlag && t.riskFlag !== 'none')
    ? `<div class="risk">⚠️ 风险提示（${esc(riskName)}）：${esc(riskBody)}本卡片为名词解释，不构成法律意见。</div>` : '';
  const low = (t.confidence ?? 1) < 0.6
    ? `<div class="risk">⚠️ 行业内无统一口径，以下为常见用法，使用前建议与合作方对齐定义。</div>` : '';

  card.className = 'card split';
  card.innerHTML = `
    <div class="lcol">
      <div class="idx">${String(idx + 1).padStart(2, '0')} / ${String(pool.length).padStart(2, '0')}</div>
      <h1>${esc(t.termZh)}</h1>
      ${t.termEn ? `<div class="en">${esc(t.termEn)}</div>` : ''}
      <div class="tags">
        <span class="tag">${esc(CATS[t.category] || t.category)}</span>
        ${(t.aliases || []).map(a => `<span class="tag plain">${esc(a)}</span>`).join('')}
      </div>
      <div class="def"><h2>定义</h2><p>${esc(t.definition)}</p></div>
      <div class="lfoot">${esc(t.sourceType || '')}　·　confidence ${(t.confidence ?? 0).toFixed(2)}</div>
    </div>
    <div class="rcol">
      ${sec('说人话', t.plainAnalogy, 'analogy')}
      ${sec('为什么重要', t.whyItMatters)}
      ${sec('常见误用', t.misuse)}
      ${t.metricHint ? sec('量化口径', t.metricHint) : ''}
      ${(t.relatedTerms || []).length
          ? `<p class="rel"><b>关联词</b>${t.relatedTerms.map(esc).join('　/　')}</p>` : ''}
      ${low}${risk}
    </div>`;
  counter.textContent = (idx + 1) + ' / ' + pool.length;
  catName.textContent = CATS[t.category] || t.category;
  bar.style.width = ((idx + 1) / pool.length * 100) + '%';
}

/* ---------- 翻页 ---------- */
function go(step){
  if (lock) return;
  const next = idx + step;
  if (next < -1 || next > pool.length) return;
  lock = true;
  card.classList.add(step > 0 ? 'out-next' : 'out-prev');
  setTimeout(() => {
    idx = next; render();
    card.classList.remove('out-next', 'out-prev');
    setTimeout(() => lock = false, 170);
  }, 210);
}

/* 真·鼠标滑动：一次手势翻一条，节流抵消触控板惯性 */
let wheelAt = 0;
window.addEventListener('wheel', e => {
  if ($('panel').classList.contains('open')) return;
  if (window.innerWidth <= 900) return;        // 窄屏交给原生滚动
  const now = Date.now();
  if (now - wheelAt < 430 || Math.abs(e.deltaY) < 6) return;
  wheelAt = now; go(e.deltaY > 0 ? 1 : -1);
}, { passive: true });

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') return $('panel').classList.remove('open');
  if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)){ e.preventDefault(); go(1); }
  if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)){ e.preventDefault(); go(-1); }
});
card.addEventListener('click', e => { if (!e.target.closest('.go')) go(1); });

/* 触屏：左右滑为主，上下滑为辅 */
let tx = null, ty = null;
window.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = tx - e.changedTouches[0].clientX;
  const dy = ty - e.changedTouches[0].clientY;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx > 0 ? 1 : -1);
  else if (window.innerWidth > 900 && Math.abs(dy) > 50) go(dy > 0 ? 1 : -1);
  tx = ty = null;
}, { passive: true });

/* ---------- 顶栏动作 ---------- */
$('btnIndex').onclick = () => $('panel').classList.toggle('open');
$('panel').onclick = e => { if (e.target === $('panel')) $('panel').classList.remove('open'); };

/* 复制到剪贴板：优先用异步 Clipboard API，失败或不可用时回退到 execCommand。
   关键修复：生成的单文件 HTML 常被以 file:// 形式离线打开，此时
   navigator.clipboard 在非安全上下文（Safari / 未聚焦时 Chrome）会被禁用或 reject，
   导致复制按钮"点了没反应"。execCommand 兜底方案可在所有上下文下可靠复制。 */
function copyText(text){
  const fallback = () => new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    ok ? resolve() : reject(new Error('execCommand copy failed'));
  });

  if (navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text).catch(() => fallback());
  }
  return fallback();
}

$('btnCopy').onclick = () => {
  if (idx < 0 || idx >= pool.length) return toast('当前不是名词卡片');
  const t = pool[idx];
  const txt = [
    `【${t.termZh}】${t.termEn || ''}　·　${CATS[t.category] || t.category}`, ``,
    `定义：${t.definition}`,
    `说人话：${t.plainAnalogy}`,
    `为什么重要：${t.whyItMatters}`,
    t.misuse ? `常见误用：${t.misuse}` : '',
    t.metricHint ? `量化口径：${t.metricHint}` : '',
    (t.relatedTerms || []).length ? `关联词：${t.relatedTerms.join(' / ')}` : ''
  ].filter(Boolean).join('\n');
  copyText(txt)
    .then(() => toast('已复制「' + t.termZh + '」'))
    .catch(() => toast('复制失败，请手动选中'));
};

$('btnAuto').onclick = () => {
  const b = $('btnAuto');
  if (auto){ clearInterval(auto); auto = null; b.classList.remove('on'); b.textContent = '自动播放'; return; }
  b.classList.add('on'); b.textContent = '停止播放';
  auto = setInterval(() => {
    if (idx >= pool.length){ clearInterval(auto); auto = null; b.classList.remove('on'); b.textContent = '自动播放'; return; }
    go(1);
  }, 5200);
};

buildFilters(); buildGrid(); render();

<script>

const SKELETON_GUIDE = {
  auto: "根据主题自动判断最合适的分类骨架（人物→五段式；行业黑话→产业链路；产品→模块；通用知识→通用分类）。",

  slang: "分类骨架用产业链路式：品类/交易/价格/品相/玩法/风险，覆盖这个圈子真正有壁垒的黑话。",
  product: "分类骨架用架构模块式：概览/能力/扩展/记忆/交互，讲清这个产品每个模块是什么、解决什么问题。",

};
const SYSTEM_PROMPT = `你是「知识卡片生成引擎」。用户给出主题提示词，你产出一组可分享的知识卡片，每张卡片把一件事讲透。

必须只输出一个合法 JSON 对象，不要输出 markdown 代码块、不要任何解释文字。格式：
{
  "title": "封面大标题（如：乔布斯拆解 · 40张卡片）",
  "kicker": "封面英文小标（如：STEVE JOBS · A DECONSTRUCTION）",
  "subtitle": "封面副标题（如：生平 · 作品 · 思考 · 起落 · 启发）",
  "categories": { "life": "生平轨迹", ... },
  "terms": [ {卡片对象} ]
}

每张卡片对象字段：
- termId: 3字母前缀+4位数字编号（如 job-0007, fin-0012）
- termZh: 卡片标题，2-20字，一眼看懂
- category: 必须属于 categories 里的某个 key
- definition: 定义，30-160字，写全不要截断
- plainAnalogy: 说人话，用生活化类比让外行秒懂，禁止引入新黑话
- whyItMatters: 为什么重要，一句话说清价值
- misuse: 常见误读，必须有实质内容（这是信息增量最高的栏，禁止写"无"或留空；想不出这条的误读就换选题）
- relatedTerms: 关联词数组，最多5个，和其他卡片串成知识网
- metricHint: 关键数字（销量/价格/年份/规模），没有把握就留空字符串
- riskFlag: "none" 或风险标签（advertising/qualification/dataPrivacy/counterfeit/fraud/minor/overPerm/dataLeak/hallucination/promptInjection）
- sourceType: industryConsensus（行业共识）/ documented（有据可查）/ inferred（推断）
- confidence: 可信度 0-1

硬性规则：
1. 张数严格等于用户要求的数量。
2. misuse 是每张卡的灵魂，逐张检查不能为空。
3. 不编造数据：不确定的数字删掉或留空，需要数据就基于公开常识。
4. confidence<0.6 的卡片要谨慎措辞。
5. 人物类必须包含失败与争议内容（fall 段至少3张），否则整套牌是吹捧，立不住。
6. 正文用简体中文，字段名保持英文 camelCase。`;

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const statusEl = $('status');
let lastDeck = null;   // {html, title}
let lastData = null;   // {terms, categories, title, kicker, subtitle}

/* —— 设备 ID + 站长额度软限制（仅代理模式计数） —— */
const DAILY_SOFT_LIMIT = 10;   // 每人每天可免费生成次数（与后端硬限制一致）
function getClientId(){
  let id = localStorage.getItem('kc_client_id');
  if (!id){
    id = (crypto.randomUUID && crypto.randomUUID()) ||
         'kc-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('kc_client_id', id);
  }
  return id;
}
function usageKey(){ return 'kc_usage_' + new Date().toISOString().slice(0, 10); }
function todayUsage(){ return parseInt(localStorage.getItem(usageKey()) || '0', 10) || 0; }
function bumpUsage(){ localStorage.setItem(usageKey(), String(todayUsage() + 1)); }

const EXAMPLES = [
  { label:"💡 乔布斯人物拆解", p:"把乔布斯拆解成一组卡片，覆盖生平轨迹/伟大作品/核心思考/起落沉浮/创业启示，misuse 写常见误读" },
  { label:"🎮 谷子经济黑话", p:"做一套谷子经济/吧唧/周边圈子的行业黑话卡片，含品类、交易、价格、品相、玩法、风险" },
  { label:"🤖 大模型术语", p:"把大模型常见术语做成知识卡片：Transformer、RAG、Agent、微调、上下文窗口、Token…" },
  { label:"📈 私域流量术语", p:"做一套私域流量运营术语卡片：私域、公域、SOP、企微、裂变、转化漏斗…" },
];
$('chips').innerHTML = EXAMPLES.map(e => `<span class="chip" data-p="${e.p}">${e.label}</span>`).join('');
$('chips').querySelectorAll('.chip').forEach(c => c.onclick = () => { $('prompt').value = c.dataset.p; $('prompt').focus(); });

function setStatus(msg, cls){ statusEl.textContent = msg; statusEl.className = cls || ''; }

function buildUserPrompt(){
  const prompt = $('prompt').value.trim();
  const count = $('count').value;
  const sk = $('skeleton').value;
  if (!prompt){ setStatus('⚠️ 先写个提示词，或点上面的示例', 'err'); return null; }
  const guide = SKELETON_GUIDE[sk];
  return `主题：${prompt}\n张数：${count} 张\n分类骨架：${guide}\n请按上述要求输出 JSON。`;
}

/* ================= DeepSeek 调用 ================= */
async function callDeepSeek(messages, apiKey){
  const res = await fetch('https://api.deepseek.com/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+apiKey },
    body: JSON.stringify({
      model:'deepseek-chat',
      messages,
      response_format:{ type:'json_object' },
      temperature:0.7,
      max_tokens: 8192
    })
  });
  if (!res.ok){
    const t = await res.text();
    let msg = 'API 错误 ' + res.status;
    try { msg = JSON.parse(t).error?.message || msg; } catch(e){}
    throw new Error(msg);
  }
  const j = await res.json();
  return JSON.parse(j.choices[0].message.content);
}

async function generateViaProxy(userPrompt){
  // GitHub Pages 上相对路径 /api 会 404，自动切到 Vercel 域名（CORS 已开放）
  const API_BASE = location.hostname.includes('github.io') ? 'https://ai-tools-hub-zeta.vercel.app' : '';
  const res = await fetch(API_BASE + '/api/knowledge-cards', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ prompt:userPrompt, clientId:getClientId() })
  });
  const j = await res.json().catch(() => ({ ok:false, error:'响应解析失败' }));
  if (!res.ok || !j.ok) throw new Error(j.error || ('请求失败 ' + res.status));
  return j.data;
}

/* ================= 校验 & 渲染 ================= */
function validate(data, wantCount){
  const terms = Array.isArray(data.terms) ? data.terms : null;
  if (!terms || !terms.length) throw new Error('AI 返回的 JSON 里没有 terms 数组，请重试');
  const cats = data.categories && Object.keys(data.categories).length ? data.categories : CATEGORY_LABEL;
  const missing = [...new Set(terms.map(t => t.category))].filter(c => !cats[c]);
  if (missing.length) throw new Error('AI 返回了未知分类: ' + missing.join(', ') + '，请重试');
  const bad = terms.filter(t => !t.termZh || !t.definition || !t.misuse);
  if (bad.length) throw new Error('有 ' + bad.length + ' 张卡片缺字段（termZh/definition/misuse），请重试');
  return { terms, categories:cats };
}

function buildDeckHTML(data){
  const { terms, categories } = data;
  const title = data.title || (terms.length + ' 张知识卡片');
  const kicker = data.kicker || 'KNOWLEDGE CARD DECK';
  const subtitle = data.subtitle || (new Date().toLocaleDateString('zh-CN') + ' · 老刘聊AI');
  const tpl = $('deckTemplate').textContent;
  return tpl
    .replace('__DATA__', JSON.stringify(terms))
    .replace('__CATS__', JSON.stringify(categories))
    .replace('__RISKS__', JSON.stringify(RISK_LABEL))
    .replace('__RISKTEXT__', JSON.stringify(RISK_TEXT))
    .split('__TITLE__').join(title)
    .split('__KICKER__').join(kicker)
    .split('__SUBTITLE__').join(subtitle);
}

function showDeck(data){
  const html = buildDeckHTML(data);
  lastDeck = html;
  lastData = data;
  $('preview').srcdoc = html;
  $('btnDownload').disabled = false;
  $('btnCopyJson').disabled = false;
}

/* ================= 主流程 ================= */
async function doGenerate(){
  const userPrompt = buildUserPrompt();
  if (!userPrompt) return;
  const apiKey = $('apiKey').value.trim();
  $('btnGenerate').disabled = true;
  try {
    setStatus(apiKey ? '⏳ 正在调用你的 DeepSeek Key 生成卡片（约 30-90 秒）…' : '⏳ 正在通过站长代理生成（未配置 Key 时也可用「复制提示词」模式）…', 'wait');
    let data;
    if (apiKey){
      data = await callDeepSeek([
        { role:'system', content:SYSTEM_PROMPT },
        { role:'user', content:userPrompt }
      ], apiKey);
    } else {
      // 软限制：本地计数（后端还有 IP+设备ID 硬限制兜底）
      const used = todayUsage();
      if (used >= DAILY_SOFT_LIMIT){
        setStatus('😅 今日免费额度已用完（' + DAILY_SOFT_LIMIT + ' 次/天/人）。填自己的 DeepSeek Key 或「复制提示词」可继续生成。', 'err');
        return;
      }
      data = await generateViaProxy(userPrompt);
    }
    const { terms, categories } = validate(data, $('count').value);
    showDeck({ ...data, terms, categories });
    if (!apiKey) bumpUsage();
    const left = Math.max(0, DAILY_SOFT_LIMIT - todayUsage());
    setStatus(`✅ 生成成功：${terms.length} 张卡片。今日免费额度剩余 ${left} 次。滑一下翻一张，右上角可筛选 / 复制 / 自动播放。`, 'ok');
  } catch(e){
    console.error(e);
    const msg = String(e.message);
    if (msg.includes('DAILY_LIMIT_USER')){
      setStatus('😅 今日免费生成次数已达上限（' + DAILY_SOFT_LIMIT + ' 次/人/天），明天再来；或填自己的 DeepSeek Key / 复制提示词，不受限。', 'err');
    } else if (msg.includes('DAILY_LIMIT_GLOBAL')){
      setStatus('😅 今天全站免费额度已被用完（站长配置上限），明天再来；或填自己的 DeepSeek Key，不受限。', 'err');
    } else if (msg.includes('NO_KEY') || msg.includes('站长未配置')){
      setStatus('😅 站长暂未开放免费额度。请填入你自己的 DeepSeek Key，或点「复制提示词」用任意 AI 生成。', 'err');
    } else {
      setStatus('❌ ' + e.message, 'err');
    }
  } finally {
    $('btnGenerate').disabled = false;
  }
}
$('btnGenerate').onclick = doGenerate;

/* 测试 Key */
$('btnTestKey').onclick = async () => {
  const apiKey = $('apiKey').value.trim();
  if (!apiKey){ setStatus('⚠️ 先填入 DeepSeek API Key', 'err'); return; }
  $('btnTestKey').disabled = true;
  try {
    await callDeepSeek([
      { role:'system', content:'只回复两个字：正常' },
      { role:'user', content:'测试' }
    ], apiKey);
    setStatus('✅ Key 有效，可以生成卡片了', 'ok');
  } catch(e){
    setStatus('❌ Key 无效或网络不通：' + e.message, 'err');
  } finally {
    $('btnTestKey').disabled = false;
  }
};

/* 无 Key：复制提示词模式 */
$('btnCopyPrompt').onclick = () => {
  const userPrompt = buildUserPrompt();
  if (!userPrompt) return;
  const full = `【角色设定】\n${SYSTEM_PROMPT}\n\n【本次任务】\n${userPrompt}\n\n请只输出 JSON，不要 markdown 代码块。`;
  navigator.clipboard.writeText(full).then(() => {
    setStatus('📋 提示词已复制！去任意 AI 工具粘贴生成，把返回的 JSON 粘贴到下面', 'ok');
    $('pasteArea').classList.remove('hidden');
    $('pasteJson').focus();
  }).catch(() => setStatus('复制失败，请手动复制', 'err'));
};

$('btnRenderPaste').onclick = () => {
  const raw = $('pasteJson').value.trim();
  if (!raw){ setStatus('⚠️ 先粘贴 JSON', 'err'); return; }
  try {
    const data = JSON.parse(raw);
    const { terms, categories } = validate(data, 0);
    showDeck({ ...data, terms, categories });
    setStatus(`✅ 渲染成功：${terms.length} 张卡片。`, 'ok');
  } catch(e){
    setStatus('❌ JSON 解析失败：' + e.message + '（检查是否有多余文字/逗号）', 'err');
  }
};

/* 下载 & 复制 */
$('btnDownload').onclick = () => {
  if (!lastDeck) return;
  const blob = new Blob(['\ufeff' + lastDeck], { type:'text/html;charset=utf-8' });
  const a = document.createElement('a');
  const title = lastData?.title || '知识卡片';
  a.href = URL.createObjectURL(blob);
  a.download = title.replace(/[\\/:*?"<>|]/g, '').slice(0, 40) + '.html';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
};

$('btnCopyJson').onclick = () => {
  if (!lastData) return;
  const payload = {
    title: lastData.title, kicker: lastData.kicker, subtitle: lastData.subtitle,
    categories: lastData.categories, terms: lastData.terms
  };
  navigator.clipboard.writeText(JSON.stringify(payload, null, 2))
    .then(() => setStatus('📋 JSON 已复制（可保存复用，或导入技能包的 assets/ 目录）', 'ok'))
    .catch(() => setStatus('复制失败，请手动复制', 'err'));
};

/* Key 存 localStorage（仅本机浏览器） */
const savedKey = localStorage.getItem('kc_deepseek_key');
if (savedKey) $('apiKey').value = savedKey;
$('apiKey').addEventListener('change', () => {
  const v = $('apiKey').value.trim();
  v ? localStorage.setItem('kc_deepseek_key', v) : localStorage.removeItem('kc_deepseek_key');
});
</script>
